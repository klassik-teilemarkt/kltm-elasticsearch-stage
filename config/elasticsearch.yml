cluster.name: "kltm-elastic-stage"
network.host: 0.0.0.0
http.port: 9200
discovery.type: single-node

# Render does not expose host sysctl configuration to this container.
node.store.allow_mmap: false

# This small stage service provides search, not local ML inference.
xpack.ml.enabled: false

# Require authentication on the Render private network.
xpack.security.enabled: true
xpack.security.enrollment.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false
